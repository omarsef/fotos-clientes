<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mis Fotos · TresEles</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .client-topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 32px;
      background: #111; border-bottom: 1px solid #222;
    }
    .client-topbar .logo { font-size:1.2rem; font-weight:700; letter-spacing:3px; color:#fff; }
    .client-topbar .logo span { color:#c9a84c; }
    .client-topbar .user-info { display:flex; align-items:center; gap:16px; }
    .client-topbar .user-info span { color:#888; font-size:0.85rem; }

    .client-body { padding-top: 65px; max-width: 1200px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }

    .welcome-bar {
      padding: 32px 0 20px;
      border-bottom: 1px solid #222;
      margin-bottom: 28px;
    }
    .welcome-bar h1 { font-size:1.4rem; font-weight:300; letter-spacing:3px; text-transform:uppercase; color:#fff; }
    .welcome-bar p { color:#888; margin-top:8px; font-size:0.9rem; }

    .selection-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: #161616; border: 1px solid #2a2a2a; border-radius:6px;
      padding: 16px 22px; margin-bottom: 24px;
    }
    .selection-bar p { color:#aaa; font-size:0.9rem; }
    .selection-bar p span { color:#c9a84c; font-weight:700; font-size:1.1rem; }

    .btn-confirm {
      padding: 11px 28px; background: #c9a84c; border: none; border-radius: 4px;
      color: #000; font-weight: 700; font-size: 0.85rem; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; transition: background 0.2s;
    }
    .btn-confirm:hover { background: #e0be6a; }
    .btn-confirm:disabled { background: #444; color: #777; cursor: not-allowed; }

    .empty-state {
      text-align: center; padding: 80px 20px; color: #555;
    }
    .empty-state p { font-size: 1rem; letter-spacing: 1px; }

    /* Lightbox */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,0.93);
      align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius:4px; }
    .lightbox-close {
      position: absolute; top: 20px; right: 28px;
      font-size: 2rem; color: #fff; cursor: pointer; background: none; border: none;
    }
    .lightbox-actions {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 16px;
    }

    .toast {
      position: fixed; bottom: 30px; right: 30px; z-index: 9999;
      background: #c9a84c; color: #000; padding: 14px 24px;
      border-radius: 6px; font-weight: 700; font-size: 0.9rem;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <header class="client-topbar">
    <div class="logo">TRES<span>ELES</span></div>
    <div class="user-info">
      <span id="clientEmail"></span>
      <button class="btn-secondary" onclick="logout()">Salir</button>
    </div>
  </header>

  <div class="client-body">

    <div class="welcome-bar">
      <h1>Hola, <span id="clientName">cliente</span></h1>
      <p>Hacé clic en las fotos que más te gustan para seleccionarlas. Cuando termines, confirmá tu selección.</p>
    </div>

    <div class="selection-bar">
      <p>Fotos seleccionadas: <span id="countSelected">0</span></p>
      <button class="btn-confirm" id="btnConfirm" disabled>Confirmar selección</button>
    </div>

    <div id="galeriaCliente" class="gallery-grid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <p>Todavía no hay fotos cargadas en tu galería.</p>
      <p style="margin-top:10px; font-size:0.82rem; color:#444;">Volvé en unos días.</p>
    </div>

  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <img id="lightboxImg" src="" alt="" />
    <div class="lightbox-actions">
      <button class="btn-confirm" id="lightboxSelect">Seleccionar esta foto</button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script type="module" src="js/cliente.js"></script>
</body>
</html>
