<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ingresar · TresEles</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="login-page">
    <div class="login-box">

      <div class="logo">TRES<span>ELES</span></div>
      <h2>Acceder a mis fotos</h2>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tu@email.com" required />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary">Ingresar</button>
        <p class="error-msg" id="errorMsg">Email o contraseña incorrectos.</p>
      </form>

      <p style="margin-top:24px;">
        <a href="index.html" style="color:#555; font-size:0.82rem; letter-spacing:1px;">← Volver al inicio</a>
      </p>

    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
